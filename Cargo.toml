[workspace]
resolver = "3"
members = ["crates/klattsch-core", "crates/klattsch-cli", "crates/klattsch-godot"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SomeMixedVegetables/klattschGodotPlugin"
# Not published to crates.io (also keeps these crates out of THIRD-PARTY-NOTICES.md).
publish = false

[workspace.dependencies]
klattsch-core = { path = "crates/klattsch-core" }
