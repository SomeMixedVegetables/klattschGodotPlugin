# Tests the core against the original JS engine on every platform, builds the
# GDExtension for Windows, Linux and macOS (universal), and packages
# addons/klattsch as the `klattsch-godot-addon` artifact. Pushing a tag
# vX.Y.Z (matching the version in Cargo.toml) also publishes a GitHub
# release with klattsch-godot-vX.Y.Z.zip and that version's CHANGELOG.md
# section as its notes.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The JS engine the port is checked against: tgies/klattsch 0.8.0 (its
  # src/, bin/ and package.json are what the parity fixtures were made from).
  KLATTSCH_JS_REF: 43189e6f9f311e9514cc0809b080d0ccb9eb746d

jobs:
  test:
    name: parity tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is off for now (GitHub's Apple Silicon runners were not
        # available); to turn it back on, add macos-14 here and remove the
        # `if: false` from build-macos.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: klattsch-godot
    steps:
      - uses: actions/checkout@v4
        with:
          path: klattsch-godot
      # The tools look for the JS engine next to the repository.
      - uses: actions/checkout@v4
        with:
          repository: tgies/klattsch
          ref: ${{ env.KLATTSCH_JS_REF }}
          path: klattsch-main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: klattsch-godot
      # Fixtures are made on each platform: Math.pow, like the port, uses the
      # platform C library.
      - name: Record JS fixtures
        run: |
          node tools/gen-fixtures.mjs
          node tools/fuzz.mjs --seed 1 --scale 1
      - name: Test
        run: cargo test --release -p klattsch-core -p klattsch-cli -p klattsch-godot

  build:
    name: library (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            built: klattsch_godot.dll
            # Static C runtime: players need no Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          - name: linux
            # Built on an older glibc so the library runs on more distributions.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            built: libklattsch_godot.so
            rustflags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release -p klattsch-godot --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.built }}
          if-no-files-found: error

  build-macos:
    if: false  # macOS is off for now; see the test job's matrix.
    name: library (macos universal)
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release -p klattsch-godot --target aarch64-apple-darwin
          cargo build --release -p klattsch-godot --target x86_64-apple-darwin
      - name: Make a universal library and sign it ad hoc
        run: |
          lipo -create -output libklattsch_godot.dylib \
            target/aarch64-apple-darwin/release/libklattsch_godot.dylib \
            target/x86_64-apple-darwin/release/libklattsch_godot.dylib
          lipo -info libklattsch_godot.dylib
          codesign --force --sign - libklattsch_godot.dylib
          codesign --verify --verbose libklattsch_godot.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: lib-macos
          path: libklattsch_godot.dylib
          if-no-files-found: error

  package:
    name: addon
    needs: [test, build, build-macos]
    # Runs when build-macos is skipped too (only a failure stops it).
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          path: libs
      - name: Assemble addons/klattsch
        run: |
          # The macOS library is included when build-macos ran.
          macos=()
          if [ -f libs/lib-macos/libklattsch_godot.dylib ]; then
            macos=(--macos libs/lib-macos/libklattsch_godot.dylib)
          fi
          python3 tools/package_addon.py \
            --windows libs/lib-windows/klattsch_godot.dll \
            --linux libs/lib-linux/libklattsch_godot.so \
            "${macos[@]}" --allow-missing \
            --out dist/klattsch-godot
      # Downloaded as a zip whose top level is addons/: unzip into a project.
      - uses: actions/upload-artifact@v4
        with:
          name: klattsch-godot-addon
          path: dist/klattsch-godot
          if-no-files-found: error

  release:
    name: GitHub release
    # Like package: a skipped build-macos must not skip the release.
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: klattsch-godot-addon
          path: dist/klattsch-godot
      - name: Check the tag against Cargo.toml and CHANGELOG.md
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          # The notes: this version's section, without its heading.
          awk -v v="## $version" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Zip the addon
        run: (cd dist/klattsch-godot && zip -qr "$GITHUB_WORKSPACE/klattsch-godot-$GITHUB_REF_NAME.zip" addons)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "klattsch-godot-$GITHUB_REF_NAME.zip" --title "klattsch for Godot $GITHUB_REF_NAME" --notes-file notes.md
